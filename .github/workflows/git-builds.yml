name: Build Hyprland -git stack

on:
  push:
    branches: [main]
    paths:
      - 'pkgbuilds/**'
      - 'scripts/build_stack.sh'
      - 'scripts/stack_plan.py'
      - 'scripts/soname_drift.py'
      - '.github/workflows/git-builds.yml'
  pull_request:
    paths:
      - 'pkgbuilds/**'
      - 'scripts/build_stack.sh'
      - 'scripts/stack_plan.py'
      - 'scripts/soname_drift.py'
      - '.github/workflows/git-builds.yml'
  workflow_dispatch:

concurrency:
  group: git-builds-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    container: archlinux:latest@sha256:b0deabeb3d283da2c7f7dbf0eea051b7b2cd0554e0b737cc457fd21683bdcdd1
    steps:
      - name: Install build tooling
        run: pacman -Syu --noconfirm --needed base-devel git sudo github-cli python

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Trust the checkout (container runs as root)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Choose the release number
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
                   --json tagName --jq '.[].tagName' |
                 sed -n 's/^v\([0-9][0-9]*\)$/\1/p' | sort -n | tail -n1)
          echo "number=$(( ${last:-1} + 1 ))" >> "$GITHUB_OUTPUT"

      - name: Prepare unprivileged builder
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder

      - name: Build the stack in dependency order
        run: bash scripts/build_stack.sh builder "${{ steps.release.outputs.number }}" dist

      - name: Every linked soname resolves against the current Arch repos
        run: |
          pacman -Fy --noconfirm
          python scripts/soname_drift.py dist/*/*.pkg.tar.zst | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: github.ref != 'refs/heads/main'
        with:
          name: hypr-stack
          path: dist/*/*.pkg.tar.zst
          retention-days: 7
          if-no-files-found: error

      - name: Publish release and prune old stack releases
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.release.outputs.number }}
        run: |
          set -euo pipefail
          tag="v$NUMBER"
          {
            echo "Hyprland -git stack built from $GITHUB_REPOSITORY@$GITHUB_SHA at pinned upstream commits."
            echo
            for package in dist/*/*.pkg.tar.zst; do
              echo "- \`$(basename "$package")\`"
            done
          } > notes.md
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --latest --title "Hyprland -git stack $NUMBER" --notes-file notes.md \
            dist/*/*.pkg.tar.zst
          tags=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
                   --json tagName --jq '.[].tagName')
          {
            sed -n 's/^v\([0-9][0-9]*\)$/\1/p' <<<"$tags" | sort -rn | tail -n +4 | sed 's/^/v/'
            grep -E '^v[0-9].*\.r[0-9]+\.g[0-9a-f]+$' <<<"$tags" || true
          } | while read -r old; do
            gh release delete "$old" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          done
          echo "published \`$tag\`" >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      - name: Kick pacman-repo publish
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --repo "$GITHUB_REPOSITORY"
