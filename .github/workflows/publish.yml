name: Publish pacman repo

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'
  repository_dispatch:
    types: [package-released]
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest@sha256:b0deabeb3d283da2c7f7dbf0eea051b7b2cd0554e0b737cc457fd21683bdcdd1
    steps:
      - name: Install tooling
        run: pacman -Syu --noconfirm --needed git github-cli gnupg python

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Collect complete expected package set
        env:
          # github.token only sees this repo — private repos (e.g. hyprstate)
          # need RELEASE_READ_TOKEN: a fine-grained PAT with contents:read
          # on the tracked repos.
          GH_TOKEN: ${{ secrets.RELEASE_READ_TOKEN != '' && secrets.RELEASE_READ_TOKEN || github.token }}
        run: python scripts/collect_packages.py --output site/x86_64

      - name: Partition packages by architecture
        run: |
          # Releases carry per-architecture builds alongside arch=any packages.
          # Serve one pacman directory per architecture; an arch=any package
          # belongs in every one of them, so it is copied rather than moved.
          shopt -s nullglob
          mkdir -p site/aarch64
          for package in site/x86_64/*-aarch64.pkg.tar.zst; do
            mv "$package" site/aarch64/
          done
          for package in site/x86_64/*-any.pkg.tar.zst; do
            cp "$package" site/aarch64/
          done
          # Nothing at all for aarch64 (not even arch=any) -> no directory.
          rmdir site/aarch64 2>/dev/null || true
          for dir in site/*/; do
            echo "${dir%/}: $(ls "$dir" | wc -l) packages"
          done

      - name: Sign packages and build signed repository database
        env:
          PACKAGE_SIGNING_KEY: ${{ secrets.PACKAGE_SIGNING_KEY }}
        run: |
          if [ -z "$PACKAGE_SIGNING_KEY" ]; then
            echo "::error::PACKAGE_SIGNING_KEY is not configured"
            exit 1
          fi
          printf '%s' "$PACKAGE_SIGNING_KEY" | gpg --batch --import
          expected=$(tr -d '[:space:]' < signing-fingerprint.txt)
          if ! gpg --batch --list-secret-keys "$expected" >/dev/null 2>&1; then
            echo "::error::imported key does not match signing-fingerprint.txt"
            exit 1
          fi
          shopt -s nullglob
          # One signed database per architecture directory. An arch=any package
          # is signed once per directory it appears in, because each database
          # needs the detached signature sitting beside the package file.
          for dir in site/*/; do
            dir=${dir%/}
            for package in "$dir"/*.pkg.tar.zst; do
              gpg --batch --yes --local-user "$expected" --detach-sign "$package"
            done
            (
              cd "$dir"
              repo-add --include-sigs --sign --key "$expected" \
                mason.db.tar.gz *.pkg.tar.zst
              # Pages doesn't serve symlinks — replace them with real files.
              for file in mason.db mason.files mason.db.sig mason.files.sig; do
                if [ -L "$file" ]; then
                  cp --remove-destination "$(readlink "$file")" "$file"
                fi
              done
            )
          done
          cp keys/mason-repo.asc site/
          gpg --batch --yes --local-user "$expected" --detach-sign site/manifest.json

      - name: Generate index page
        run: |
          {
            echo '<!doctype html><meta charset="utf-8"><title>mason pacman repo</title>'
            echo '<h1>[mason] pacman repository</h1><pre>'
            echo '[mason]'
            echo 'SigLevel = Required DatabaseRequired'
            # $arch is substituted by pacman from its Architecture setting, so
            # one Server line serves x86_64 and aarch64 clients alike.
            echo 'Server = https://masonrhodesdev.github.io/arch-repo/$arch'
            echo '</pre>'
            echo '<p><a href="mason-repo.asc">Signing key</a> · <a href="manifest.json">Validated manifest</a></p>'
            for dir in site/*/; do
              echo "<h2>$(basename "${dir%/}")</h2><ul>"
              for p in "$dir"*.pkg.tar.zst; do
                [ -e "$p" ] && echo "<li>$(basename "$p")</li>"
              done
              echo '</ul>'
            done
            echo "<p>Updated $(date -u +%Y-%m-%dT%H:%M:%SZ)</p>"
          } > site/index.html

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
